name: Deploy to Lightsail

# Same pipeline as the medicon app (Abhishek-cyno/Docquiz): build on every push
# to main and rsync dist/ to the Lightsail server.
#
# The destination is deliberately NOT a secret. This server also hosts
# medicon.eqova.in (/var/www/medicon) and the rsync below runs with --delete,
# so a TARGET_PATH secret holding medicon's path by mistake would overwrite
# medicon with this site. Hard-coding the quiz folder, and checking it again
# before the copy, makes that impossible.
#
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   SSH_PRIVATE_KEY  the same deploy key the Docquiz repo uses
#   SSH_HOST         the server address (13.202.18.203)
#   SSH_USERNAME     the server login user (bitnami)
on:
  push:
    branches: [ main ]
  # Lets the first deploy (or a redeploy) be started from the Actions tab
  # without having to push a commit.
  workflow_dispatch:

env:
  DEPLOY_TARGET: /var/www/quiz/

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Refuse to deploy anywhere but the quiz folder
        run: |
          if [ "$DEPLOY_TARGET" != "/var/www/quiz/" ]; then
            echo "::error::Deploy target is '$DEPLOY_TARGET', not /var/www/quiz/ - stopping so no other site can be overwritten."
            exit 1
          fi
          test -f dist/index.html || { echo "::error::dist/index.html missing - build output looks wrong"; exit 1; }

      - name: Deploy dist/ to Lightsail
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          TARGET: ${{ env.DEPLOY_TARGET }}
          SOURCE: "dist/"
          # --delete keeps the server an exact copy of dist/; .well-known is
          # excluded so it never wipes the Let's Encrypt renewal challenge.
          ARGS: "-rlgoDzvc -i --delete --exclude=.well-known"
