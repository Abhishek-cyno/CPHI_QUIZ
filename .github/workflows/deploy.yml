name: Deploy to Lightsail

# Same pipeline as the medicon app (Abhishek-cyno/Docquiz): build on every push
# to main and rsync dist/ to the Lightsail server. Only TARGET_PATH differs —
# it points at the quiz.eqova.in document root instead of medicon's.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   SSH_PRIVATE_KEY  the same deploy key the Docquiz repo uses
#   SSH_HOST         the server address (13.202.18.203)
#   SSH_USERNAME     the server login user
#   TARGET_PATH      the quiz.eqova.in DocumentRoot, with a trailing slash
on:
  push:
    branches: [ main ]
  # Lets the first deploy (or a redeploy) be started from the Actions tab
  # without having to push a commit.
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy dist/ to Lightsail
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USERNAME }}
          TARGET: ${{ secrets.TARGET_PATH }}
          SOURCE: "dist/"
          # --delete keeps the server an exact copy of dist/; .well-known is
          # excluded so it never wipes the Let's Encrypt renewal challenge.
          ARGS: "-rlgoDzvc -i --delete --exclude=.well-known"
